set timeout=8
set default=0

# Ask GRUB for a linear framebuffer the kernel can draw into.
insmod all_video
set gfxmode=1280x720x32,1024x768x32,1920x1080x32,1920x1200x32,auto
set gfxpayload=keep

menuentry "bornomalaOS (Live)" {
    multiboot2 /boot/mykernel.bin boot_mode=live
    boot
}

menuentry "bornomalaOS Installer" {
    multiboot2 /boot/mykernel.bin boot_mode=installer
    boot
}

menuentry "bornomalaOS (Persistent)" {
    multiboot2 /boot/mykernel.bin boot_mode=persistent
    boot
}
